services:
  lotr-web:
    build:
      context: .
      dockerfile: web-server/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__UsersConnection: Host=lotr-users-db;Port=5432;Database=lotr_users;Username=postgres;Password=postgres
      JurassicApi__BaseUrl: http://host.docker.internal:5081
      Jwt__Secret: Cool_Mega_Secret_Key_For_JWT_Token_Generation
      LotrApi__BaseUrl: http://lotr-api:8080
    depends_on:
      lotr-api:
        condition: service_started
      lotr-users-db:
        condition: service_healthy
    ports:
      - "5292:8080"

  lotr-api:
    build:
      context: ./api-server/backend/src
      dockerfile: LotrApi/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__DefaultConnection: Host=lotr-db;Port=5432;Database=lotr;Username=postgres;Password=postgres
      Jwt__Secret: Cool_Mega_Secret_Key_For_JWT_Token_Generation
    depends_on:
      lotr-db:
        condition: service_healthy
    ports:
      - "5030:8080"

  lotr-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lotr
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lotr"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    volumes:
      - lotr-api-data:/var/lib/postgresql/data

  lotr-users-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lotr_users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lotr_users"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    volumes:
      - ./web-server/database/schema:/docker-entrypoint-initdb.d:ro
      - lotr-users-data:/var/lib/postgresql/data

volumes:
  lotr-api-data:
  lotr-users-data:
